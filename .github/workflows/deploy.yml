name: Deploy to Xserver

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build English page
        run: |
          npm ci --no-audit --no-fund
          node scripts/build-en.mjs

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: sv14468.xserver.jp
          username: iyuya0623
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          server-dir: /technophere.com/public_html/portfolio/
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            CLAUDE.md
            DESIGN_RULE.md
            CONTENT.md
            scripts/**
            package.json
            package-lock.json
